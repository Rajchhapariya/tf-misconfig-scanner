name: CI & Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run Unit & Integration Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Pytest Suite
        run: |
          pytest -v

  security-scan:
    name: Self-Scan & Upload SARIF to Code Scanning
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scanner
        run: |
          pip install -e .

      - name: Fetch TerraGoat
        run: |
          bash scripts/fetch_terragoat.sh

      - name: Scan Fixtures & Emit SARIF
        run: |
          mkdir -p results
          tfscan scan fixtures/ --format sarif --output results/fixtures.sarif || true

      - name: Scan TerraGoat AWS & Emit SARIF
        run: |
          tfscan scan data/terragoat/terraform/aws --format sarif --output results/terragoat.sarif || true

      - name: Upload Fixtures SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results/fixtures.sarif
          category: tfscan-fixtures

      - name: Upload TerraGoat SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results/terragoat.sarif
          category: tfscan-terragoat
